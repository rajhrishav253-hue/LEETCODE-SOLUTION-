name: Organize LeetCode solutions by topic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-topic-organizer
  cancel-in-progress: false

jobs:
  organize:
    # Do not run again on the organizer's own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install requests

      - name: Organize new LeetSync folders
        run: python scripts/organize_leetcode.py
